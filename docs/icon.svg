<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <title>Steered Code</title>
  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#C89B3C" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#C89B3C" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#C89B3C" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- badge ground -->
  <rect x="0" y="0" width="512" height="512" rx="100" fill="#12181F" />
  <rect x="0" y="0" width="512" height="512" rx="100" fill="url(#glow)" />
  <rect x="6" y="6" width="500" height="500" rx="96" fill="none" stroke="#C89B3C" stroke-opacity="0.18" stroke-width="2" />

  <!-- wheel rim -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#C89B3C" stroke-width="10" />

  <!-- spokes + handles (6, ship's-wheel style) -->
  <g stroke="#C89B3C" stroke-linecap="round">
    <!-- top -->
    <line x1="256" y1="192" x2="256" y2="106" stroke-width="10" />
    <line x1="256" y1="106" x2="256" y2="84" stroke-width="14" />
    <circle cx="256" cy="84" r="10" fill="#C89B3C" stroke="none" />
    <!-- upper right -->
    <line x1="311" y1="224" x2="386" y2="181" stroke-width="10" />
    <line x1="386" y1="181" x2="405" y2="170" stroke-width="14" />
    <circle cx="405" cy="170" r="10" fill="#C89B3C" stroke="none" />
    <!-- lower right -->
    <line x1="311" y1="288" x2="386" y2="331" stroke-width="10" />
    <line x1="386" y1="331" x2="405" y2="342" stroke-width="14" />
    <circle cx="405" cy="342" r="10" fill="#C89B3C" stroke="none" />
    <!-- bottom -->
    <line x1="256" y1="320" x2="256" y2="406" stroke-width="10" />
    <line x1="256" y1="406" x2="256" y2="428" stroke-width="14" />
    <circle cx="256" cy="428" r="10" fill="#C89B3C" stroke="none" />
    <!-- lower left -->
    <line x1="201" y1="288" x2="126" y2="331" stroke-width="10" />
    <line x1="126" y1="331" x2="107" y2="342" stroke-width="14" />
    <circle cx="107" cy="342" r="10" fill="#C89B3C" stroke="none" />
    <!-- upper left -->
    <line x1="201" y1="224" x2="126" y2="181" stroke-width="10" />
    <line x1="126" y1="181" x2="107" y2="170" stroke-width="14" />
    <circle cx="107" cy="170" r="10" fill="#C89B3C" stroke="none" />
  </g>

  <!-- hub -->
  <circle cx="256" cy="256" r="64" fill="#0A0D11" stroke="#C89B3C" stroke-width="8" />

  <!-- code glyph </> as the hub, standing in for "instruction becomes code" -->
  <g fill="none" stroke="#EDE6D6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M222,234 L204,256 L222,278" />
    <path d="M240,276 L272,236" />
    <path d="M290,234 L308,256 L290,278" />
  </g>
</svg>
